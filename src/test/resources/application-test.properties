spring.datasource.url=jdbc:h2:mem:glowshop_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# No Kafka broker required for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

logging.level.org.springframework.security=WARN

jwt.secret=test-jwt-secret-at-least-32-characters-long-for-hmac-sha256
jwt.expiration-ms=3600000
