<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop - Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">GlowShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/products}">Products</a>
            <a class="nav-link" th:href="@{/cart}">Cart</a>
            <a class="nav-link" th:href="@{/orders}">My Orders</a>
            <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2>Checkout</h2>
    <p class="text-muted">Review your order and enter a shipping address. Payment is out of scope for this demo—submitting confirms the order only.</p>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row mt-3">
        <div class="col-lg-7">
            <div class="card mb-3">
                <div class="card-header">Cart summary</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between" th:each="item : ${cart.items}">
                        <span th:text="${item.product.name} + ' × ' + ${item.quantity}"></span>
                        <span th:text="'$' + ${#numbers.formatDecimal(item.product.price * item.quantity, 1, 2)}"></span>
                    </li>
                </ul>
                <div class="card-footer fw-bold d-flex justify-content-between">
                    <span>Total</span>
                    <span class="text-primary" th:text="'$' + ${#numbers.formatDecimal(cartTotal, 1, 2)}"></span>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header">Shipping</div>
                <div class="card-body">
                    <form th:action="@{/checkout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label for="shippingAddress" class="form-label">Shipping address</label>
                            <textarea class="form-control" id="shippingAddress" name="shippingAddress"
                                      rows="4" required placeholder="Street, city, postal code, country"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Place order</button>
                        <a th:href="@{/cart}" class="btn btn-outline-secondary w-100 mt-2">Back to cart</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
