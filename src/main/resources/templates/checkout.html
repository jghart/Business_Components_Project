<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop - Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f0f0f; --surface: #161616; --surface-2: #1e1e1e;
            --border: #2a2a2a; --text: #e8e6e1; --muted: #888;
            --gold: #c9a96e; --gold-dark: #a07840; --white: #f5f3ef;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.6; }

        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15,15,15,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem; display: flex; align-items: center;
            justify-content: space-between; height: 64px;
        }
        .nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 700; color: var(--gold); text-decoration: none; letter-spacing: 0.04em; }
        .nav-links { display: flex; align-items: center; gap: 1.5rem; }
        .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; transition: color 0.2s; }
        .nav-links a:hover { color: var(--white); }
        .btn-logout { padding: 0.4rem 1.1rem; border: 1px solid var(--border); border-radius: 4px; background: none; color: var(--muted); font-size: 0.8rem; cursor: pointer; font-family: 'Inter', sans-serif; transition: border-color 0.2s, color 0.2s; }
        .btn-logout:hover { border-color: #555; color: var(--text); }

        .page-wrapper { max-width: 1000px; margin: 0 auto; padding: 3rem 2rem 5rem; }
        .page-eyebrow { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; }
        .page-title { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 600; color: var(--white); margin-bottom: 0.5rem; }
        .page-note { font-size: 0.8rem; color: var(--muted); margin-bottom: 2.5rem; }

        .alert { padding: 0.75rem 1rem; border-radius: 4px; font-size: 0.82rem; margin-bottom: 1.5rem; }
        .alert-error { background: rgba(170,74,74,0.12); border: 1px solid rgba(170,74,74,0.3); color: #cc7777; }

        /* Layout */
        .checkout-layout { display: grid; grid-template-columns: 1fr 360px; gap: 2.5rem; align-items: start; }

        /* Shipping Form */
        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2rem; }
        .form-card-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; color: var(--white); margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.25rem; }
        .form-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); }
        .form-textarea {
            padding: 0.75rem 1rem; background: var(--bg);
            border: 1px solid var(--border); border-radius: 4px;
            color: var(--text); font-size: 0.9rem; font-family: 'Inter', sans-serif;
            resize: vertical; min-height: 110px;
            transition: border-color 0.2s;
        }
        .form-textarea:focus { outline: none; border-color: var(--gold); }
        .form-textarea::placeholder { color: var(--muted); }
        .btn-place-order {
            width: 100%; padding: 0.85rem;
            background: var(--gold); border: none; border-radius: 4px;
            color: #0f0f0f; font-weight: 600; font-size: 0.85rem;
            letter-spacing: 0.08em; text-transform: uppercase;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: background 0.2s; margin-bottom: 0.75rem;
        }
        .btn-place-order:hover { background: var(--gold-dark); }
        .btn-back-cart {
            display: block; width: 100%; padding: 0.75rem; text-align: center;
            border: 1px solid var(--border); border-radius: 4px;
            color: var(--muted); text-decoration: none;
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
            transition: border-color 0.2s, color 0.2s;
        }
        .btn-back-cart:hover { border-color: var(--gold); color: var(--gold); }

        /* Order Summary */
        .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; position: sticky; top: 80px; }
        .summary-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
        .summary-header-title { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 600; color: var(--white); }
        .summary-items { padding: 0.5rem 0; }
        .summary-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); }
        .summary-item:last-child { border-bottom: none; }
        .summary-item-name { font-size: 0.85rem; color: var(--text); }
        .summary-item-qty { font-size: 0.75rem; color: var(--muted); margin-top: 0.1rem; }
        .summary-item-price { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
        .summary-footer { padding: 1.25rem 1.5rem; border-top: 1px solid var(--border); background: var(--surface-2); }
        .summary-total-row { display: flex; justify-content: space-between; align-items: baseline; }
        .summary-total-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
        .summary-total-amount { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 700; color: var(--gold); }

        footer { border-top: 1px solid var(--border); padding: 2.5rem 2rem; text-align: center; color: var(--muted); font-size: 0.8rem; }
        footer span { color: var(--gold); }

        @media (max-width: 768px) { .checkout-layout { grid-template-columns: 1fr; } .summary-card { position: static; } }
    </style>
    <link rel="stylesheet" th:href="@{/css/glowshop-layout.css}"/>
</head>
<body class="site-sticky-footer">

<nav>
    <a class="nav-brand" href="/">GlowShop</a>
    <div class="nav-links">
        <a href="/products">Products</a>
        <a href="/cart">Cart</a>
        <a href="/orders">Orders</a>
        <a href="/admin/dashboard" sec:authorize="hasRole('ADMIN')" style="color:var(--gold);">Admin</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Sign Out</button>
        </form>
    </div>
</nav>

<main class="site-main">

<div class="page-wrapper">
    <p class="page-eyebrow">Final Step</p>
    <h1 class="page-title">Checkout</h1>
    <p class="page-note">Enter your shipping address to place your order. Payment is out of scope for this demo.</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="checkout-layout">

        <!-- Left — Shipping Form -->
        <div class="form-card">
            <div class="form-card-title">Shipping Address</div>
            <form th:action="@{/checkout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                    <label class="form-label" for="shippingAddress">Full Address</label>
                    <textarea id="shippingAddress" name="shippingAddress"
                              class="form-textarea" required
                              placeholder="Street address, city, province/state, postal code, country">
                    </textarea>
                </div>
                <button type="submit" class="btn-place-order">Place Order</button>
                <a href="/cart" class="btn-back-cart">← Back to Cart</a>
            </form>
        </div>

        <!-- Right — Order Summary -->
        <div class="summary-card">
            <div class="summary-header">
                <div class="summary-header-title">Order Summary</div>
            </div>
            <div class="summary-items">
                <div class="summary-item" th:each="item : ${cart.items}">
                    <div>
                        <div class="summary-item-name" th:text="${item.product.name}">Product</div>
                        <div class="summary-item-qty" th:text="'Qty: ' + ${item.quantity}">Qty: 1</div>
                    </div>
                    <div class="summary-item-price"
                         th:text="'$' + ${#numbers.formatDecimal(item.product.price * item.quantity, 1, 2)}">
                        $0.00
                    </div>
                </div>
            </div>
            <div class="summary-footer">
                <div class="summary-total-row">
                    <span class="summary-total-label">Total</span>
                    <span class="summary-total-amount"
                          th:text="'$' + ${#numbers.formatDecimal(cartTotal, 1, 2)}">$0.00</span>
                </div>
            </div>
        </div>

    </div>
</div>

</main>

<footer>© 2026 <span>GlowShop</span>. All rights reserved.</footer>
</body>
</html>
