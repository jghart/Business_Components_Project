<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop - Beauty &amp; Wellness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">GlowShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/products}">Products</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/cart}">Cart</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>
            <a class="nav-link" sec:authorize="!isAuthenticated()" th:href="@{/register}">Register</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container text-center mt-5">
    <h1 class="display-4">Welcome to GlowShop</h1>
    <p class="lead text-muted mt-3">Your one-stop beauty and wellness store.</p>
    <p class="text-muted">Discover skincare, haircare, wellness, and fragrance products curated for you.</p>
    <div class="mt-4">
        <a th:href="@{/products}" class="btn btn-primary btn-lg me-2">Browse Products</a>
        <a sec:authorize="!isAuthenticated()" th:href="@{/register}" class="btn btn-outline-secondary btn-lg">Create Account</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
