<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">GlowShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/products}">Products</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/cart}">Cart</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="mb-3">Our Products</h2>

    <!-- Search + Filter Row -->
    <div class="row mb-4">
        <div class="col-md-6">
            <form th:action="@{/products}" method="get" class="d-flex">
                <input type="text" name="search" class="form-control me-2"
                       placeholder="Search products..."
                       th:value="${search}"/>
                <button type="submit" class="btn btn-outline-primary">Search</button>
            </form>
        </div>
        <div class="col-md-4">
            <form th:action="@{/products}" method="get">
                <select name="categoryId" class="form-select" onchange="this.form.submit()">
                    <option value="">All Categories</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${selectedCategoryId != null and selectedCategoryId == cat.id}">
                    </option>
                </select>
            </form>
        </div>
        <div class="col-md-2">
            <a th:href="@{/products}" class="btn btn-secondary w-100">Clear</a>
        </div>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(products)}" class="alert alert-info">
        No products found. Try a different search or category.
    </div>

    <!-- Product grid -->
    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" th:each="product : ${products}">
            <div class="card h-100">
                <img th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                     th:src="${product.imageUrl}"
                     class="card-img-top" alt="Product image"
                     style="height: 200px; object-fit: cover;"/>
                <div th:if="${product.imageUrl == null or product.imageUrl.isEmpty()}"
                     class="card-img-top bg-light d-flex align-items-center justify-content-center"
                     style="height: 200px;">
                    <span class="text-muted">No Image</span>
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${product.name}"></h5>
                    <p class="text-muted small mb-1" th:text="${product.category.name}"></p>
                    <p class="card-text small flex-grow-1"
                       th:text="${product.description != null and product.description.length() > 80}
                               ? ${product.description.substring(0, 80) + '...'}
                               : ${product.description}">
                    </p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="fw-bold text-primary fs-5"
                              th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></span>
                        <span th:if="${product.stockQuantity > 0}" class="badge bg-success">In Stock</span>
                        <span th:if="${product.stockQuantity <= 0}" class="badge bg-danger">Out of Stock</span>
                    </div>
                    <div class="mt-3">
                        <a th:href="@{/products/{id}(id=${product.id})}"
                           class="btn btn-outline-primary btn-sm w-100">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <p class="text-muted mt-4" th:text="'Showing ' + ${products.size()} + ' product(s)'"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
