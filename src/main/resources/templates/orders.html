<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop - My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">GlowShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/products}">Products</a>
            <a class="nav-link" th:href="@{/cart}">Cart</a>
            <a class="nav-link" th:href="@{/orders}">My Orders</a>
            <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2>My Orders</h2>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info mt-3">
        You have no orders yet. <a th:href="@{/products}">Browse products</a>.
    </div>

    <div th:if="${!#lists.isEmpty(orders)}" class="table-responsive mt-3">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Order #</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th class="text-end">Total</th>
                    <th class="text-center">Details</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${o.id}"></td>
                    <td th:text="${#temporals.format(o.createdAt, 'MMM d, yyyy HH:mm')}"></td>
                    <td><span class="badge bg-secondary" th:text="${o.status}"></span></td>
                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(o.totalAmount, 1, 2)}"></td>
                    <td class="text-center">
                        <a th:href="@{/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary">View</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
