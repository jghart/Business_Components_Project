<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop - My Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f0f0f; --surface: #161616; --surface-2: #1e1e1e;
            --border: #2a2a2a; --text: #e8e6e1; --muted: #888;
            --gold: #c9a96e; --gold-dark: #a07840; --white: #f5f3ef;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.6; }

        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15,15,15,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem; display: flex; align-items: center;
            justify-content: space-between; height: 64px;
        }
        .nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 700; color: var(--gold); text-decoration: none; letter-spacing: 0.04em; }
        .nav-links { display: flex; align-items: center; gap: 1.5rem; }
        .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--white); }
        .btn-logout { padding: 0.4rem 1.1rem; border: 1px solid var(--border); border-radius: 4px; background: none; color: var(--muted); font-size: 0.8rem; cursor: pointer; font-family: 'Inter', sans-serif; transition: border-color 0.2s, color 0.2s; }
        .btn-logout:hover { border-color: #555; color: var(--text); }

        .page-wrapper { max-width: 1000px; margin: 0 auto; padding: 3rem 2rem 5rem; }
        .page-eyebrow { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; }
        .page-title { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 600; color: var(--white); margin-bottom: 2rem; }

        .alert { padding: 0.75rem 1rem; border-radius: 4px; font-size: 0.82rem; margin-bottom: 1.5rem; }
        .alert-error { background: rgba(170,74,74,0.12); border: 1px solid rgba(170,74,74,0.3); color: #cc7777; }

        /* Empty State */
        .empty-state { text-align: center; padding: 5rem 2rem; color: var(--muted); }
        .empty-state h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--text); margin-bottom: 0.75rem; }
        .empty-state p { margin-bottom: 2rem; }
        .btn-shop { display: inline-block; padding: 0.65rem 1.75rem; background: var(--gold); border-radius: 4px; color: #0f0f0f; text-decoration: none; font-weight: 600; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; transition: background 0.2s; }
        .btn-shop:hover { background: var(--gold-dark); }

        /* Orders Table */
        .orders-table { width: 100%; border-collapse: collapse; }
        .orders-table thead tr { border-bottom: 1px solid var(--border); }
        .orders-table th { padding: 0.75rem 1rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); font-weight: 500; text-align: left; }
        .orders-table th.right { text-align: right; }
        .orders-table th.center { text-align: center; }
        .orders-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
        .orders-table tbody tr:hover { background: var(--surface); }
        .orders-table td { padding: 1rem; font-size: 0.875rem; color: var(--muted); }
        .orders-table td.right { text-align: right; }
        .orders-table td.center { text-align: center; }
        .orders-table td.bold { color: var(--text); font-weight: 500; }
        .orders-table td.price { color: var(--gold); font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-weight: 600; }

        .status-badge { display: inline-block; padding: 0.25rem 0.65rem; border-radius: 4px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }

        .btn-view-order { display: inline-block; padding: 0.35rem 0.9rem; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); text-decoration: none; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; transition: border-color 0.2s, color 0.2s; }
        .btn-view-order:hover { border-color: var(--gold); color: var(--gold); }

        footer { border-top: 1px solid var(--border); padding: 2.5rem 2rem; text-align: center; color: var(--muted); font-size: 0.8rem; }
        footer span { color: var(--gold); }
    </style>
    <link rel="stylesheet" th:href="@{/css/glowshop-layout.css}"/>
</head>
<body class="site-sticky-footer">

<nav>
    <a class="nav-brand" href="/">GlowShop</a>
    <div class="nav-links">
        <a href="/products">Products</a>
        <a href="/cart">Cart</a>
        <a href="/orders" class="active">Orders</a>
        <a href="/admin/dashboard" sec:authorize="hasRole('ADMIN')" style="color:var(--gold);">Admin</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Sign Out</button>
        </form>
    </div>
</nav>

<main class="site-main">

<div class="page-wrapper">
    <p class="page-eyebrow">Account</p>
    <h1 class="page-title">My Orders</h1>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <h3>No orders yet</h3>
        <p>You haven't placed any orders. Start shopping!</p>
        <a href="/products" class="btn-shop">Browse Products</a>
    </div>

    <!-- Orders Table -->
    <table class="orders-table" th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>Order #</th>
            <th>Date</th>
            <th>Status</th>
            <th class="right">Total</th>
            <th class="center">Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td class="bold" th:text="'#' + ${o.id}"></td>
            <td th:text="${#temporals.format(o.createdAt, 'MMM d, yyyy · HH:mm')}"></td>
            <td><span class="status-badge" th:text="${o.status}"></span></td>
            <td class="price right"
                th:text="'$' + ${#numbers.formatDecimal(o.totalAmount, 1, 2)}"></td>
            <td class="center">
                <a th:href="@{/orders/{id}(id=${o.id})}" class="btn-view-order">View →</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</main>

<footer>© 2026 <span>GlowShop</span>. All rights reserved.</footer>
</body>
</html>
