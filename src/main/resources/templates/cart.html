<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop - My Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">GlowShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/products}">Products</a>
            <a class="nav-link" th:href="@{/cart}">Cart</a>
            <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2>My Shopping Cart</h2>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Empty cart -->
    <div th:if="${#lists.isEmpty(cart.items)}" class="text-center mt-5">
        <h4 class="text-muted">Your cart is empty</h4>
        <a th:href="@{/products}" class="btn btn-primary mt-3">Browse Products</a>
    </div>

    <!-- Cart items -->
    <div th:if="${!#lists.isEmpty(cart.items)}">
        <div class="table-responsive mt-3">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th style="width: 150px;">Quantity</th>
                        <th>Subtotal</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cart.items}">
                        <td>
                            <div class="d-flex align-items-center">
                                <img th:if="${item.product.imageUrl != null and !item.product.imageUrl.isEmpty()}"
                                     th:src="${item.product.imageUrl}"
                                     alt="Product" style="width: 50px; height: 50px; object-fit: cover;"
                                     class="rounded me-3"/>
                                <div>
                                    <a th:href="@{/products/{id}(id=${item.product.id})}"
                                       th:text="${item.product.name}" class="text-decoration-none fw-bold"></a>
                                    <br/>
                                    <small class="text-muted" th:text="${item.product.category.name}"></small>
                                </div>
                            </div>
                        </td>
                        <td th:text="'$' + ${#numbers.formatDecimal(item.product.price, 1, 2)}"></td>
                        <td>
                            <form th:action="@{/cart/update/{id}(id=${item.id})}" method="post"
                                  class="d-flex align-items-center gap-1">
                                <input type="number" name="quantity" th:value="${item.quantity}"
                                       min="1" class="form-control form-control-sm" style="width: 70px;"/>
                                <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                            </form>
                        </td>
                        <td class="fw-bold"
                            th:text="'$' + ${#numbers.formatDecimal(item.product.price * item.quantity, 1, 2)}"></td>
                        <td class="text-center">
                            <a th:href="@{/cart/remove/{id}(id=${item.id})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Remove this item?');">Remove</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Cart summary -->
        <div class="row justify-content-end mt-3">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Cart Summary</h5>
                        <p>Items: <strong th:text="${itemCount}"></strong></p>
                        <hr/>
                        <h4>Total: <span class="text-primary"
                                         th:text="'$' + ${#numbers.formatDecimal(cartTotal, 1, 2)}"></span></h4>
                        <a th:href="@{/checkout}" class="btn btn-success w-100 mt-3">Proceed to Checkout</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/cart/clear}" class="btn btn-outline-danger btn-sm"
               onclick="return confirm('Clear all items from your cart?');">Clear Cart</a>
            <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm ms-2">Continue Shopping</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
