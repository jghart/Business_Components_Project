<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop Admin — Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/glowshop-admin.css}"/>
</head>
<body class="admin-body">

<nav class="admin-nav">
    <div class="admin-nav-brand">
        <a class="nav-brand" th:href="@{/}">GlowShop</a>
        <span class="nav-admin-tag">Admin</span>
    </div>
    <div class="admin-nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/products}">Products</a>
        <a th:href="@{/admin/categories}">Categories</a>
        <a th:href="@{/admin/orders}" class="active">Orders</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Sign Out</button>
        </form>
    </div>
</nav>

<div class="admin-wrap">

    <header class="admin-page-header">
        <div>
            <p class="admin-page-eyebrow">Fulfillment</p>
            <h1 class="admin-page-title">All Orders</h1>
        </div>
    </header>

    <div th:if="${success}" class="admin-alert success" th:text="${success}"></div>
    <div th:if="${error}" class="admin-alert danger" th:text="${error}"></div>

    <div th:if="${orders.totalElements == 0}" class="admin-empty">No orders yet.</div>

    <div th:if="${orders.totalElements > 0}" class="admin-table-wrap">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th class="num">Total</th>
                    <th class="center">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${o.id}"></td>
                    <td th:text="${o.user.email}"></td>
                    <td th:text="${#temporals.format(o.createdAt, 'MMM d, yyyy HH:mm')}"></td>
                    <td><span class="badge-status" th:text="${o.status}"></span></td>
                    <td class="num" th:text="'$' + ${#numbers.formatDecimal(o.totalAmount, 1, 2)}"></td>
                    <td class="center">
                        <a th:href="@{/admin/orders/{id}(id=${o.id})}" class="btn-sm-gold">Manage</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="admin-pagination" th:if="${orders.totalPages > 1}">
        <a th:if="${!orders.first}"
           th:href="@{/admin/orders(page=${orders.number - 1},size=${orders.size})}">← Previous</a>
        <span class="pg-info"
              th:text="'Page ' + ${orders.number + 1} + ' / ' + ${orders.totalPages}">Page 1 / 1</span>
        <a th:if="${!orders.last}"
           th:href="@{/admin/orders(page=${orders.number + 1},size=${orders.size})}">Next →</a>
    </div>
</div>

<footer class="admin-footer">© 2026 <span>GlowShop</span> Admin</footer>
</body>
</html>
