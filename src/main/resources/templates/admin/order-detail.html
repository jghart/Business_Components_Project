<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'Admin - Order #' + ${order.id}">GlowShop Admin - Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">GlowShop Admin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/orders}">All Orders</a>
            <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 th:text="'Order #' + ${order.id}"></h2>
    <p class="text-muted">
        Customer: <span th:text="${order.user.name}"></span> (<span th:text="${order.user.email}"></span>)<br/>
        Placed <span th:text="${#temporals.format(order.createdAt, 'MMM d, yyyy HH:mm')}"></span>
    </p>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card mb-3">
        <div class="card-header">Update status</div>
        <div class="card-body">
            <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="row g-2 align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-4">
                    <label for="status" class="form-label">Order status</label>
                    <select class="form-select" id="status" name="status">
                        <option th:each="s : ${T(com.ecommerce.glowshop.model.Order.OrderStatus).values()}"
                                th:value="${s}"
                                th:text="${s}"
                                th:selected="${order.status == s}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary">Save status</button>
                </div>
            </form>
            <p class="small text-muted mb-0 mt-2">Typical flow: PENDING → CONFIRMED → SHIPPED → DELIVERED. Use CANCELLED if the order will not ship.</p>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-header">Shipping address</div>
        <div class="card-body">
            <p class="mb-0" th:text="${order.shippingAddress}"></p>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Product</th>
                    <th class="text-end">Unit price</th>
                    <th class="text-center">Qty</th>
                    <th class="text-end">Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="line : ${order.orderItems}">
                    <td th:text="${line.product.name}"></td>
                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(line.priceAtPurchase, 1, 2)}"></td>
                    <td class="text-center" th:text="${line.quantity}"></td>
                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(line.subtotal, 1, 2)}"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3" class="text-end">Total</th>
                    <th class="text-end" th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></th>
                </tr>
            </tfoot>
        </table>
    </div>

    <a th:href="@{/admin/orders}" class="btn btn-secondary">Back to orders</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
