<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop Admin — Categories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/glowshop-admin.css}"/>
</head>
<body class="admin-body">

<nav class="admin-nav">
    <div class="admin-nav-brand">
        <a class="nav-brand" href="/admin/dashboard" sec:authorize="!isAuthenticated()">GlowShop</a>
        <a class="nav-brand" th:href="@{/dashboard}" sec:authorize="hasRole('CUSTOMER')">GlowShop</a>
        <a class="nav-brand" th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">GlowShop</a>
        <span class="nav-admin-tag">Admin</span>
    </div>
    <div class="admin-nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/products}">Products</a>
        <a th:href="@{/admin/categories}" class="active">Categories</a>
        <a th:href="@{/admin/orders}">Orders</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Sign Out</button>
        </form>
    </div>
</nav>

<div class="admin-wrap">

    <header class="admin-page-header">
        <div>
            <p class="admin-page-eyebrow">Catalog</p>
            <h1 class="admin-page-title">Manage Categories</h1>
        </div>
        <a th:href="@{/admin/categories/add}" class="btn-gold">+ Add Category</a>
    </header>

    <div th:if="${success}" class="admin-alert success" th:text="${success}"></div>
    <div th:if="${error}" class="admin-alert danger" th:text="${error}"></div>

    <div th:if="${categories.totalElements == 0}" class="admin-empty">
        No categories yet. Use <strong style="color:var(--gold);">+ Add Category</strong> to create one.
    </div>

    <div th:if="${categories.totalElements > 0}" class="admin-table-wrap">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th class="center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}"></td>
                    <td th:text="${category.name}"></td>
                    <td th:text="${category.description} ?: '—'"></td>
                    <td class="center">
                        <a th:href="@{/admin/categories/edit/{id}(id=${category.id})}" class="btn-sm-gold" style="margin-right:0.35rem;">Edit</a>
                        <a th:href="@{/admin/categories/delete/{id}(id=${category.id})}"
                           class="btn-sm-danger"
                           onclick="return confirm('Delete this category? Linked products may be affected.');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class="admin-meta" th:text="'Total categories: ' + ${categories.totalElements}"></p>

    <div class="admin-pagination" th:if="${categories.totalPages > 1}">
        <a th:if="${!categories.first}"
           th:href="@{/admin/categories(page=${categories.number - 1},size=${categories.size})}">← Previous</a>
        <span class="pg-info"
              th:text="'Page ' + ${categories.number + 1} + ' / ' + ${categories.totalPages}">Page 1 / 1</span>
        <a th:if="${!categories.last}"
           th:href="@{/admin/categories(page=${categories.number + 1},size=${categories.size})}">Next →</a>
    </div>
</div>

<footer class="admin-footer">© 2026 <span>GlowShop</span> Admin</footer>
</body>
</html>
