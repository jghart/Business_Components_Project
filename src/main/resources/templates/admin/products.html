<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop Admin — Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/glowshop-admin.css}"/>
</head>
<body class="admin-body">

<nav class="admin-nav">
    <div class="admin-nav-brand">
        <a class="nav-brand" th:href="@{/}">GlowShop</a>
        <span class="nav-admin-tag">Admin</span>
    </div>
    <div class="admin-nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/products}" class="active">Products</a>
        <a th:href="@{/admin/categories}">Categories</a>
        <a th:href="@{/admin/orders}">Orders</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Sign Out</button>
        </form>
    </div>
</nav>

<div class="admin-wrap">

    <header class="admin-page-header">
        <div>
            <p class="admin-page-eyebrow">Catalog</p>
            <h1 class="admin-page-title">Manage Products</h1>
        </div>
        <a th:href="@{/admin/products/add}" class="btn-gold">+ Add Product</a>
    </header>

    <div th:if="${success}" class="admin-alert success" th:text="${success}"></div>
    <div th:if="${error}" class="admin-alert danger" th:text="${error}"></div>

    <div th:if="${products.totalElements == 0}" class="admin-empty">
        No products yet. Use <strong style="color:var(--gold);">+ Add Product</strong> to create one.
    </div>

    <div th:if="${products.totalElements > 0}" class="admin-table-wrap">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th class="num">Price</th>
                    <th class="num">Stock</th>
                    <th>Skin Type</th>
                    <th class="center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.category.name}"></td>
                    <td class="num" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></td>
                    <td class="num">
                        <span th:text="${product.stockQuantity}"
                              th:classappend="${product.stockQuantity < 10} ? ' stock-low' : ''"></span>
                    </td>
                    <td th:text="${product.skinType} ?: '—'"></td>
                    <td class="center">
                        <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn-sm-gold" style="margin-right:0.35rem;">Edit</a>
                        <a th:href="@{/admin/products/delete/{id}(id=${product.id})}"
                           class="btn-sm-danger"
                           onclick="return confirm('Delete this product?');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class="admin-meta" th:text="'Total products: ' + ${products.totalElements}"></p>

    <div class="admin-pagination" th:if="${products.totalPages > 1}">
        <a th:if="${!products.first}"
           th:href="@{/admin/products(page=${products.number - 1},size=${products.size})}">← Previous</a>
        <span class="pg-info"
              th:text="'Page ' + ${products.number + 1} + ' / ' + ${products.totalPages}">Page 1 / 1</span>
        <a th:if="${!products.last}"
           th:href="@{/admin/products(page=${products.number + 1},size=${products.size})}">Next →</a>
    </div>
</div>

<footer class="admin-footer">© 2026 <span>GlowShop</span> Admin</footer>
</body>
</html>
