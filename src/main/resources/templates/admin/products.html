<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop Admin - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">GlowShop Admin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/products}">Products</a>
            <a class="nav-link" th:href="@{/admin/categories}">Categories</a>
            <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Manage Products</h2>
        <a th:href="@{/admin/products/add}" class="btn btn-success">+ Add Product</a>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(products)}" class="alert alert-info">
        No products found. Click <strong>+ Add Product</strong> to create one.
    </div>

    <!-- Product table -->
    <div th:if="${!#lists.isEmpty(products)}" class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Skin Type</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.category.name}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></td>
                    <td>
                        <span th:text="${product.stockQuantity}"
                              th:classappend="${product.stockQuantity < 10} ? 'text-danger fw-bold' : ''"></span>
                    </td>
                    <td th:text="${product.skinType} ?: 'N/A'"></td>
                    <td class="text-center">
                        <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                           class="btn btn-sm btn-primary me-1">Edit</a>
                        <a th:href="@{/admin/products/delete/{id}(id=${product.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to delete this product?');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class="text-muted mt-3" th:text="'Total products: ' + ${products.size()}"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
