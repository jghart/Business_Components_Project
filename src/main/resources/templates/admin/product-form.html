<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop Admin — Product</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/glowshop-admin.css}"/>
</head>
<body class="admin-body">

<nav class="admin-nav">
    <div class="admin-nav-brand">
        <a class="nav-brand" th:href="@{/}">GlowShop</a>
        <span class="nav-admin-tag">Admin</span>
    </div>
    <div class="admin-nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/products}" class="active">Products</a>
        <a th:href="@{/admin/categories}">Categories</a>
        <a th:href="@{/admin/orders}">Orders</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Sign Out</button>
        </form>
    </div>
</nav>

<div class="admin-wrap">

    <header class="admin-page-header" style="border-bottom:none; margin-bottom:1rem;">
        <div>
            <p class="admin-page-eyebrow">Catalog</p>
            <h1 class="admin-page-title" th:text="${product != null} ? 'Edit Product' : 'Add Product'">Add Product</h1>
        </div>
    </header>

    <div th:if="${error}" class="admin-alert danger" th:text="${error}"></div>

    <form class="admin-form"
          th:action="${product != null} ? @{/admin/products/edit/{id}(id=${product.id})} : @{/admin/products/add}"
          method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-field">
            <label for="name">Product name *</label>
            <input type="text" id="name" name="name"
                   th:value="${product != null} ? ${product.name} : ''" required/>
        </div>

        <div class="form-field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"
                      th:text="${product != null} ? ${product.description} : ''"></textarea>
        </div>

        <div class="form-field">
            <label for="ingredients">Ingredients</label>
            <textarea id="ingredients" name="ingredients" rows="2"
                      th:text="${product != null} ? ${product.ingredients} : ''"></textarea>
        </div>

        <div class="form-row-2">
            <div class="form-field">
                <label for="price">Price ($) *</label>
                <input type="number" step="0.01" min="0.01" id="price" name="price"
                       th:value="${product != null} ? ${product.price} : ''" required/>
            </div>
            <div class="form-field">
                <label for="stockQuantity">Stock *</label>
                <input type="number" min="0" id="stockQuantity" name="stockQuantity"
                       th:value="${product != null} ? ${product.stockQuantity} : ''" required/>
            </div>
        </div>

        <div class="form-row-2">
            <div class="form-field">
                <label for="categoryId">Category *</label>
                <select id="categoryId" name="categoryId" required>
                    <option value="">— Select —</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${product != null and product.category.id == cat.id}">
                    </option>
                </select>
            </div>
            <div class="form-field">
                <label for="skinType">Skin type</label>
                <select id="skinType" name="skinType">
                    <option value="">— None —</option>
                    <option value="All Skin Types" th:selected="${product != null and product.skinType == 'All Skin Types'}">All Skin Types</option>
                    <option value="Oily" th:selected="${product != null and product.skinType == 'Oily'}">Oily</option>
                    <option value="Dry" th:selected="${product != null and product.skinType == 'Dry'}">Dry</option>
                    <option value="Combination" th:selected="${product != null and product.skinType == 'Combination'}">Combination</option>
                    <option value="Sensitive" th:selected="${product != null and product.skinType == 'Sensitive'}">Sensitive</option>
                    <option value="Normal" th:selected="${product != null and product.skinType == 'Normal'}">Normal</option>
                </select>
            </div>
        </div>

        <div class="form-field">
            <label for="imageUrl">Image URL</label>
            <input type="text" id="imageUrl" name="imageUrl" placeholder="https://…"
                   th:value="${product != null} ? ${product.imageUrl} : ''"/>
        </div>

        <div class="admin-form-actions">
            <button type="submit" class="btn-gold" th:text="${product != null} ? 'Update product' : 'Add product'">Save</button>
            <a th:href="@{/admin/products}" class="btn-outline">Cancel</a>
        </div>
    </form>
</div>

<footer class="admin-footer">© 2026 <span>GlowShop</span> Admin</footer>
</body>
</html>
