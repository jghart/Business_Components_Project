<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop Admin - Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">GlowShop Admin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/products}">Products</a>
            <a class="nav-link" th:href="@{/admin/categories}">Categories</a>
            <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 th:text="${product != null} ? 'Edit Product' : 'Add New Product'"></h2>
    <hr/>

    <!-- Flash messages -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="${product != null} ? @{/admin/products/edit/{id}(id=${product.id})} : @{/admin/products/add}"
          method="post"
          class="row g-3"
          style="max-width: 700px;">

        <div class="col-12">
            <label for="name" class="form-label">Product Name *</label>
            <input type="text" class="form-control" id="name" name="name"
                   th:value="${product != null} ? ${product.name} : ''" required/>
        </div>

        <div class="col-12">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3"
                      th:text="${product != null} ? ${product.description} : ''"></textarea>
        </div>

        <div class="col-12">
            <label for="ingredients" class="form-label">Ingredients</label>
            <textarea class="form-control" id="ingredients" name="ingredients" rows="2"
                      th:text="${product != null} ? ${product.ingredients} : ''"></textarea>
        </div>

        <div class="col-md-6">
            <label for="price" class="form-label">Price ($) *</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="price" name="price"
                   th:value="${product != null} ? ${product.price} : ''" required/>
        </div>

        <div class="col-md-6">
            <label for="stockQuantity" class="form-label">Stock Quantity *</label>
            <input type="number" min="0" class="form-control" id="stockQuantity" name="stockQuantity"
                   th:value="${product != null} ? ${product.stockQuantity} : ''" required/>
        </div>

        <div class="col-md-6">
            <label for="categoryId" class="form-label">Category *</label>
            <select class="form-select" id="categoryId" name="categoryId" required>
                <option value="">-- Select Category --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${product != null and product.category.id == cat.id}">
                </option>
            </select>
        </div>

        <div class="col-md-6">
            <label for="skinType" class="form-label">Skin Type</label>
            <select class="form-select" id="skinType" name="skinType">
                <option value="">-- None --</option>
                <option value="All Skin Types"
                        th:selected="${product != null and product.skinType == 'All Skin Types'}">All Skin Types</option>
                <option value="Oily"
                        th:selected="${product != null and product.skinType == 'Oily'}">Oily</option>
                <option value="Dry"
                        th:selected="${product != null and product.skinType == 'Dry'}">Dry</option>
                <option value="Combination"
                        th:selected="${product != null and product.skinType == 'Combination'}">Combination</option>
                <option value="Sensitive"
                        th:selected="${product != null and product.skinType == 'Sensitive'}">Sensitive</option>
                <option value="Normal"
                        th:selected="${product != null and product.skinType == 'Normal'}">Normal</option>
            </select>
        </div>

        <div class="col-12">
            <label for="imageUrl" class="form-label">Image URL</label>
            <input type="text" class="form-control" id="imageUrl" name="imageUrl"
                   placeholder="https://example.com/image.jpg"
                   th:value="${product != null} ? ${product.imageUrl} : ''"/>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-primary"
                    th:text="${product != null} ? 'Update Product' : 'Add Product'"></button>
            <a th:href="@{/admin/products}" class="btn btn-secondary ms-2">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
