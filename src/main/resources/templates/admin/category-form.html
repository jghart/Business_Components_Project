<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop Admin — Category</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/glowshop-admin.css}"/>
</head>
<body class="admin-body">

<nav class="admin-nav">
    <div class="admin-nav-brand">
        <a class="nav-brand" href="/" sec:authorize="!isAuthenticated()">GlowShop</a>
        <a class="nav-brand" th:href="@{/dashboard}" sec:authorize="hasRole('CUSTOMER')">GlowShop</a>
        <a class="nav-brand" th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">GlowShop</a>
        <span class="nav-admin-tag">Admin</span>
    </div>
    <div class="admin-nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/products}">Products</a>
        <a th:href="@{/admin/categories}" class="active">Categories</a>
        <a th:href="@{/admin/orders}">Orders</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Sign Out</button>
        </form>
    </div>
</nav>

<div class="admin-wrap">

    <header class="admin-page-header" style="border-bottom:none; margin-bottom:1rem;">
        <div>
            <p class="admin-page-eyebrow">Catalog</p>
            <h1 class="admin-page-title" th:text="${category != null} ? 'Edit Category' : 'Add Category'">Category</h1>
        </div>
    </header>

    <div th:if="${error}" class="admin-alert danger" th:text="${error}"></div>

    <form class="admin-form"
          th:action="${category != null} ? @{/admin/categories/edit/{id}(id=${category.id})} : @{/admin/categories/add}"
          method="post" style="max-width:520px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-field">
            <label for="name">Category name *</label>
            <input type="text" id="name" name="name"
                   th:value="${category != null} ? ${category.name} : ''" required/>
        </div>

        <div class="form-field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"
                      th:text="${category != null} ? ${category.description} : ''"></textarea>
        </div>

        <div class="admin-form-actions">
            <button type="submit" class="btn-gold" th:text="${category != null} ? 'Update category' : 'Add category'">Save</button>
            <a th:href="@{/admin/categories}" class="btn-outline">Cancel</a>
        </div>
    </form>
</div>

<footer class="admin-footer">© 2026 <span>GlowShop</span> Admin</footer>
</body>
</html>
