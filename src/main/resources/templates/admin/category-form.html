<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop Admin - Category Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">GlowShop Admin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/products}">Products</a>
            <a class="nav-link" th:href="@{/admin/categories}">Categories</a>
            <a class="nav-link" th:href="@{/admin/orders}">Orders</a>
            <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 th:text="${category != null} ? 'Edit Category' : 'Add New Category'"></h2>
    <hr/>

    <!-- Flash messages -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="${category != null} ? @{/admin/categories/edit/{id}(id=${category.id})} : @{/admin/categories/add}"
          method="post"
          class="row g-3"
          style="max-width: 500px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="col-12">
            <label for="name" class="form-label">Category Name *</label>
            <input type="text" class="form-control" id="name" name="name"
                   th:value="${category != null} ? ${category.name} : ''" required/>
        </div>

        <div class="col-12">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3"
                      th:text="${category != null} ? ${category.description} : ''"></textarea>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-primary"
                    th:text="${category != null} ? 'Update Category' : 'Add Category'"></button>
            <a th:href="@{/admin/categories}" class="btn btn-secondary ms-2">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
