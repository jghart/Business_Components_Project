<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GlowShop - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f0f0f; --surface: #161616; --surface-2: #1e1e1e;
            --border: #2a2a2a; --text: #e8e6e1; --muted: #888;
            --gold: #c9a96e; --gold-dark: #a07840; --white: #f5f3ef;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; min-height: 100dvh; }

        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15,15,15,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem; display: flex; align-items: center;
            justify-content: space-between; height: 64px;
        }
        .nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 700; color: var(--gold); text-decoration: none; letter-spacing: 0.04em; }
        .nav-links { display: flex; align-items: center; gap: 1.5rem; }
        .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; transition: color 0.2s; }
        .nav-links a:hover { color: var(--white); }
        .btn-nav-outline { padding: 0.4rem 1.1rem; border: 1px solid var(--border); border-radius: 4px; color: var(--text) !important; font-size: 0.8rem !important; transition: border-color 0.2s, color 0.2s !important; }
        .btn-nav-outline:hover { border-color: var(--gold) !important; color: var(--gold) !important; }

        .auth-wrapper {
            display: flex; align-items: center; justify-content: center;
            min-height: calc(100dvh - 64px);
            padding: 2rem;
        }
        .auth-card {
            width: 100%; max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2.5rem;
        }
        .auth-eyebrow { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; text-align: center; }
        .auth-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 600; color: var(--white); text-align: center; margin-bottom: 2rem; }

        .alert { padding: 0.75rem 1rem; border-radius: 4px; font-size: 0.82rem; margin-bottom: 1.25rem; }
        .alert-error { background: rgba(170,74,74,0.12); border: 1px solid rgba(170,74,74,0.3); color: #cc7777; }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.25rem; min-width: 0; }
        .form-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); }
        .form-input {
            width: 100%;
            padding: 0.65rem 1rem; background: var(--bg);
            border: 1px solid var(--border); border-radius: 4px;
            color: var(--text); font-size: 0.9rem; font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--gold); }
        .form-input::placeholder { color: var(--muted); }

        /* ✅ FIX: min-width: 0 on both row and children prevents overflow */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            min-width: 0;
        }
        .form-row > .form-group { min-width: 0; }

        .btn-submit {
            width: 100%; padding: 0.75rem;
            background: var(--gold); border: none; border-radius: 4px;
            color: #0f0f0f; font-weight: 600; font-size: 0.85rem;
            letter-spacing: 0.08em; text-transform: uppercase;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: background 0.2s; margin-top: 0.5rem;
        }
        .btn-submit:hover { background: var(--gold-dark); }

        .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: var(--muted); }
        .auth-footer a { color: var(--gold); text-decoration: none; transition: color 0.2s; }
        .auth-footer a:hover { color: var(--white); }

        footer { border-top: 1px solid var(--border); padding: 2rem; text-align: center; color: var(--muted); font-size: 0.8rem; }
        footer span { color: var(--gold); }

        /* Stack password row on very small screens */
        @media (max-width: 420px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/glowshop-layout.css}"/>
</head>
<body class="site-sticky-footer">

<nav>
    <a class="nav-brand" href="/" sec:authorize="!isAuthenticated()">GlowShop</a>
    <a class="nav-brand" th:href="@{/dashboard}" sec:authorize="hasRole('CUSTOMER')">GlowShop</a>
    <a class="nav-brand" th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">GlowShop</a>
    <div class="nav-links">
        <a href="/products">Products</a>
        <a href="/login" class="btn-nav-outline">Login</a>
    </div>
</nav>

<main class="site-main">

<div class="auth-wrapper">
    <div class="auth-card">
        <p class="auth-eyebrow">Join GlowShop</p>
        <h1 class="auth-title">Create Account</h1>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-input"
                       placeholder="Your name" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input"
                       placeholder="you@example.com" required/>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="••••••••" required/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                           placeholder="••••••••" required/>
                </div>
            </div>
            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
        </p>
    </div>
</div>

</main>

<footer>© 2026 <span>GlowShop</span>. All rights reserved.</footer>
</body>
</html>
