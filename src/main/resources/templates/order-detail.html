<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'GlowShop - Order #' + ${order.id}">GlowShop - Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">GlowShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/products}">Products</a>
            <a class="nav-link" th:href="@{/cart}">Cart</a>
            <a class="nav-link" th:href="@{/orders}">My Orders</a>
            <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 th:text="'Order #' + ${order.id}"></h2>
    <p class="text-muted">
        Placed <span th:text="${#temporals.format(order.createdAt, 'MMM d, yyyy HH:mm')}"></span>
        · Status: <span class="badge bg-secondary" th:text="${order.status}"></span>
    </p>

    <div class="card mb-3">
        <div class="card-header">Shipping address</div>
        <div class="card-body">
            <p class="mb-0" th:text="${order.shippingAddress}"></p>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Product</th>
                    <th class="text-end">Price at purchase</th>
                    <th class="text-center">Qty</th>
                    <th class="text-end">Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="line : ${order.orderItems}">
                    <td th:text="${line.product.name}"></td>
                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(line.priceAtPurchase, 1, 2)}"></td>
                    <td class="text-center" th:text="${line.quantity}"></td>
                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(line.subtotal, 1, 2)}"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3" class="text-end">Total</th>
                    <th class="text-end text-primary" th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></th>
                </tr>
            </tfoot>
        </table>
    </div>

    <p class="text-muted small mt-2">Line prices are <strong>snapshots</strong> from checkout time—they stay correct even if the catalog price changes later.</p>

    <a th:href="@{/orders}" class="btn btn-secondary">Back to my orders</a>
    <a th:href="@{/products}" class="btn btn-outline-primary">Continue shopping</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
