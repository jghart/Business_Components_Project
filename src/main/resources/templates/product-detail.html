<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'GlowShop - ' + ${product.name}">GlowShop - Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">GlowShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/products}">Products</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/cart}">Cart</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/products}">Products</a></li>
            <li class="breadcrumb-item"><a th:href="@{/products(categoryId=${product.category.id})}"
                                           th:text="${product.category.name}"></a></li>
            <li class="breadcrumb-item active" th:text="${product.name}"></li>
        </ol>
    </nav>

    <div class="row">
        <!-- Product Image -->
        <div class="col-md-5">
            <img th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                 th:src="${product.imageUrl}"
                 class="img-fluid rounded" alt="Product image"/>
            <div th:if="${product.imageUrl == null or product.imageUrl.isEmpty()}"
                 class="bg-light rounded d-flex align-items-center justify-content-center"
                 style="height: 350px;">
                <span class="text-muted fs-5">No Image Available</span>
            </div>
        </div>

        <!-- Product Info -->
        <div class="col-md-7">
            <h2 th:text="${product.name}"></h2>
            <p class="text-muted" th:text="'Category: ' + ${product.category.name}"></p>

            <h3 class="text-primary" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></h3>

            <div class="my-3">
                <span th:if="${product.stockQuantity > 0}" class="badge bg-success fs-6">
                    In Stock (<span th:text="${product.stockQuantity}"></span> available)
                </span>
                <span th:if="${product.stockQuantity <= 0}" class="badge bg-danger fs-6">Out of Stock</span>
            </div>

            <div th:if="${product.skinType != null and !product.skinType.isEmpty()}" class="mb-3">
                <strong>Skin Type:</strong> <span th:text="${product.skinType}"></span>
            </div>

            <div th:if="${product.description != null}" class="mb-3">
                <h5>Description</h5>
                <p th:text="${product.description}"></p>
            </div>

            <div th:if="${product.ingredients != null and !product.ingredients.isEmpty()}" class="mb-3">
                <h5>Ingredients</h5>
                <p class="text-muted small" th:text="${product.ingredients}"></p>
            </div>

            <!-- Add to Cart -->
            <div sec:authorize="isAuthenticated()" th:if="${product.stockQuantity > 0}" class="mt-4">
                <form th:action="@{/cart/add}" method="post" class="d-flex align-items-center gap-2">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="productId" th:value="${product.id}"/>
                    <label for="quantity" class="form-label mb-0 me-2">Qty:</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1"
                           th:max="${product.stockQuantity}"
                           class="form-control" style="width: 80px;"/>
                    <button type="submit" class="btn btn-primary">Add to Cart</button>
                </form>
            </div>

            <div sec:authorize="!isAuthenticated()" class="mt-4">
                <a th:href="@{/login}" class="btn btn-outline-primary">Login to Add to Cart</a>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/products}" class="btn btn-secondary">Back to Products</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
