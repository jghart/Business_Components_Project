# APPLICATION
spring.application.name=glowshop


# DATABASE (MySQL via XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/glowshop_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# THYMELEAF
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# SERVER
server.port=8080

# KAFKA: optional. Default build excludes Kafka auto-config and uses a no-op publisher.
# Start with broker:  java -jar app.jar --spring.profiles.active=kafka
# Settings for the kafka profile are in application-kafka.properties

# SWAGGER / OPENAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true


# LOGGING
logging.level.org.springframework.security=DEBUG
logging.level.com.ecommerce.glowshop=DEBUG